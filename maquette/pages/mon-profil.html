<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StageHub - profil</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body>
<section id="profil">
  <div class="app">
    <nav class="menu">
      <div class="logo">Stage<span>Hub</span></div>
      <a href="offres-stage.html">Offres</a><a href="mes-candidatures.html">Mes candidatures</a><a href="convention.html">Convention</a><a href="suivi-stage.html">Suivi du stage</a><a href="notifications.html">Notifications</a><a href="mon-profil.html" class="actif">Mon profil</a>
      <div class="bas">Connecté : Étudiant<br><a href="../index.html">Se déconnecter</a></div>
    </nav>
    <main class="contenu">
      <h1>Mon profil</h1>
      <p class="sous">Modifie tes informations personnelles.</p>
      <form class="carte" action="mon-profil.html" enctype="multipart/form-data">
        <div class="ligne2">
          <div><label for="profil-nom">Nom</label><input id="profil-nom" name="nom" value="Benali"></div>
          <div><label for="profil-prenom">Prénom</label><input id="profil-prenom" name="prenom" value="Youssef"></div>
        </div>
        <label for="profil-filiere">Filière</label><input id="profil-filiere" name="filiere" value="Génie informatique">
        <label for="profil-comp">Compétences</label><input id="profil-comp" name="competences" value="PHP, MySQL">
        <label for="profil-cv">Mettre à jour mon CV</label><input type="file" id="profil-cv" name="cv" accept=".pdf">
        <div class="actions"><button class="btn btn-bleu" type="submit">Enregistrer</button></div>
      </form>
    </main>
  </div>
</section>
</body>
</html>
