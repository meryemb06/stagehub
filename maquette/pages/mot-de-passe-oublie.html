<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StageHub - mot de passe oublie</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
<section id="mot-de-passe-oublie">
  <div class="auth">
    <div class="auth-box">
      <div class="logo">Stage<span>Hub</span></div>
      <p class="sous">Entre ton e-mail, nous t'enverrons un lien pour réinitialiser ton mot de passe.</p>
      <form action="../index.html">
        <label for="mot-de-passe-oublie-email">Adresse e-mail</label>
        <input type="email" id="mot-de-passe-oublie-email" name="email" required>
        <button class="btn btn-bleu btn-plein" type="submit">Envoyer le lien</button>
      </form>
      <p class="lien-bas"><a href="../index.html">Retour à la connexion</a></p>
    </div>
  </div>
</section>
</body>
</html>
