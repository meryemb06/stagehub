<!DOCTYPE html>
<html lang="fr">
<head>

<title>StageHub - Connexion</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<section id="index">
  <div class="auth">
    <div class="auth-box">
      <div class="logo">Stage<span>Hub</span></div>
      <p class="sous">Plateforme de gestion des stages et PFE</p>
      <form action="pages/offres-stage.html">
        <label for="index-email">Adresse e-mail</label>
        <input type="email" id="index-email" name="email" required>
        <label for="index-mdp">Mot de passe</label>
        <input type="password" id="index-mdp" name="mot_de_passe" required>
        <button class="btn btn-bleu btn-plein" type="submit">Se connecter</button>
      </form>
      <p class="lien-bas"><a href="pages/mot-de-passe-oublie.html">Mot de passe oublié ?</a></p>
      <p class="lien-bas">Pas de compte ? <a href="pages/inscription.html">S'inscrire</a></p>
      <p class="lien-bas" style="color:#999;font-size:.8rem">Aperçu des espaces :
        <a href="pages/offres-stage.html">Étudiant</a> ·
        <a href="pages/entreprise-mes-offres.html">Entreprise</a> ·
        <a href="pages/mes-stagiaires.html">Encadrant</a> ·
        <a href="pages/gestion-comptes.html">Admin</a></p>
    </div>
  </div>
</section>

</html>
