<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StageHub - entreprise evaluation</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body>
<section id="entreprise-evaluation">
  <div class="app">
    <nav class="menu">
      <div class="logo">Stage<span>Hub</span></div>
      <a href="entreprise-mes-offres.html">Mes offres</a><a href="publier-offre.html">Publier une offre</a><a href="candidatures-recues.html">Candidatures reçues</a><a href="evaluer-stagiaire.html" class="actif">Évaluer un stagiaire</a><a href="notifications.html">Notifications</a><a href="mon-profil.html">Mon profil</a>
      <div class="bas">Connecté : Entreprise<br><a href="../index.html">Se déconnecter</a></div>
    </nav>
    <main class="contenu">
      <h1>Évaluer le stagiaire</h1>
      <p class="sous">Youssef Benali · Développeur web PHP</p>
      <form class="carte" action="entreprise-mes-offres.html">
        <label for="entreprise-evaluation-note">Note globale (sur 20)</label><input type="number" id="entreprise-evaluation-note" name="note" min="0" max="20" step="0.5" required>
        <label for="entreprise-evaluation-assid">Assiduité</label><select id="entreprise-evaluation-assid" name="assiduite"><option>Très bien</option><option>Bien</option><option>Moyen</option><option>Insuffisant</option></select>
        <label for="entreprise-evaluation-comm">Commentaire (facultatif)</label><textarea id="entreprise-evaluation-comm" name="commentaire"></textarea>
        <div class="actions"><button class="btn btn-bleu" type="submit">Enregistrer l'évaluation</button></div>
      </form>
    </main>
  </div>
</section>
</body>
</html>
